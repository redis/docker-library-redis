
name: Build and Test
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to build'
        required: true
        type: string
      redisearch_version:
        description: 'Redisearch version to build'
        required: false
        type: string
      redisjson_version:
        description: 'Redisjson version to build'
        required: false
        type: string
      redisbloom_version:
        description: 'Redisbloom version to build'
        required: false
        type: string
      redistimeseries_version:
        description: 'Redistimeseries version to build'
        required: false
        type: string
      publish_image:
        description: 'Publish Docker image to GHCR'
        required: false
        type: boolean
        default: false
      run_type:
        description: 'Run type, either release, pr, unstable, nightly or custom'
        required: false
        type: string
      slack_channel_id:
        description: 'Slack channel ID to post notifications to'
        required: false
        type: string
        default: ''
      slack_thread_ts:
        description: 'Thread timestamp to post message as a reply (optional)'
        required: false
        type: string
        default: ''
    outputs:
      docker_images_metadata:
        description: 'Array of structured Docker images metadata that were published'
        value: ${{ jobs.collect-images-metadata.outputs.docker_images_metadata }}
      slack_ts:
        description: 'Slack message timestamp'
        value: ${{ jobs.notify-slack.outputs.slack_ts }}
      slack_url:
        description: 'URL to the Slack message'
        value: ${{ jobs.notify-slack.outputs.slack_url }}

jobs:
  build-and-test:
    runs-on: ${{ contains(matrix.platform, 'arm64') && 'ubuntu24-arm64-2-8' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - debian
          - alpine
        platform:
          - linux/amd64
          #- linux/i386
          #- linux/arm/v5
          #- linux/arm/v6
          #- linux/arm/v7
          #- linux/ppc64le
          #- linux/s390x
          #- linux/arm64
          #- linux/riscv64
        exclude:
        - distribution: alpine
          platform: linux/arm/v5
        - distribution: debian
          platform: linux/arm/v6
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ (github.ref_name == 'unstable'
            || github.event_name == 'workflow_call'
            || github.event_name == 'schedule')
            && 'unstable'
            || ''
            }}
      - name: Ensure release branch
        if: inputs.release_tag != '' && inputs.run_type == 'release'
        uses: redis-developer/redis-oss-release-automation/.github/actions/ensure-release-branch@main
        with:
          release_tag: ${{ inputs.release_tag }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          release_branch: slack_bot
      - uses: ./.github/actions/build-and-tag-locally
        with:
          distribution: ${{ matrix.distribution }}
          platform: ${{ matrix.platform }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          publish_image: ${{ inputs.publish_image }}
          registry_repository: ${{ format('ghcr.io/{0}', github.repository) }}
          release_tag: ${{ inputs.release_tag }}
          redisearch_version: ${{ inputs.redisearch_version }}
          redisjson_version: ${{ inputs.redisjson_version }}
          redisbloom_version: ${{ inputs.redisbloom_version }}
          redistimeseries_version: ${{ inputs.redistimeseries_version }}
          run_type: ${{ inputs.run_type }}

  collect-images-metadata:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ inputs.release_tag && inputs.run_type == 'release' }}
    outputs:
      docker_images_metadata: ${{ steps.collect-metadata.outputs.metadata }}
    steps:
      - name: Download all images metadata artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: image-metadata-*
          path: ./images-metadata
          merge-multiple: true

      - name: Collect images metadata from artifacts
        id: collect-metadata
        run: |
          if [ -d "./images-metadata" ] && [ "$(ls -A ./images-metadata 2>/dev/null)" ]; then
            echo "Found images metadata files:"
            # Collect all JSON files and merge them into a single array
            metadata=$(find ./images-metadata -name "*.json" -exec cat {} \; | jq -s -c '.')
            echo "Collected images metadata: $metadata"
          else
            echo "No images metadata artifacts found"
            metadata="[]"
          fi

          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"

  notify-slack:
    runs-on: ubuntu-latest
    needs: collect-images-metadata
    if: ${{ inputs.release_tag && needs.collect-images-metadata.outputs.docker_images_metadata != '[]' && inputs.run_type == 'release' }}
    outputs:
      slack_ts: ${{ steps.slack-success.outputs.slack_ts }}
      slack_url: ${{ steps.slack-success.outputs.slack_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send Slack notification
        id: slack-success
        continue-on-error: true
        uses: ./.github/actions/slack-notification
        with:
          slack_func: slack_format_docker_images_metadata_message
          slack_channel_id: ${{ inputs.slack_channel_id || vars.SLACK_CHANNEL_ID }}
          release_tag: ${{ inputs.release_tag }}
          images_metadata: ${{ needs.collect-images-metadata.outputs.docker_images_metadata }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_thread_ts: ${{ inputs.slack_thread_ts }}

  notify-slack-when-failed:
    runs-on: ubuntu-latest
    needs: collect-images-metadata
    if: ${{ inputs.release_tag && failure() && inputs.run_type == 'release' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send Failure Slack notification
        continue-on-error: true
        uses: ./.github/actions/slack-notification
        with:
          slack_func: slack_format_failure_message
          slack_channel_id: ${{ inputs.slack_channel_id || vars.SLACK_CHANNEL_ID }}
          release_tag: ${{ inputs.release_tag }}
          message: "Docker Build failed"
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_thread_ts: ${{ inputs.slack_thread_ts }}
