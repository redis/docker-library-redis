
name: Build and Test
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to build'
        required: true
        type: string
      redisearch_version:
        description: 'Redisearch version to build'
        required: false
        type: string
      redisjson_version:
        description: 'Redisjson version to build'
        required: false
        type: string
      redisbloom_version:
        description: 'Redisbloom version to build'
        required: false
        type: string
      redistimeseries_version:
        description: 'Redistimeseries version to build'
        required: false
        type: string
      publish_image:
        description: 'Publish Docker image to GHCR'
        required: false
        type: boolean
        default: false
      run_type:
        description: 'Run type, either release, pr, unstable, nightly or custom'
        required: false
        type: string
      modules_enabled:
        description: 'Whether module-specific rendering and tests should run'
        required: false
        type: boolean
        default: true
      slack_channel_id:
        description: 'Slack channel ID to post notifications to'
        required: false
        type: string
        default: ''
      slack_thread_ts:
        description: 'Thread timestamp to post message as a reply (optional)'
        required: false
        type: string
        default: ''
      override_release_branch:
        description: 'Use this release branch instead of release/X.X (for testing)'
        required: false
        type: string
    outputs:
      docker_images_metadata:
        description: 'Array of structured Docker images metadata that were published'
        value: ${{ jobs.collect-images-metadata.outputs.docker_images_metadata }}
      slack_ts:
        description: 'Slack message timestamp'
        value: ${{ jobs.notify-slack.outputs.slack_ts || jobs.notify-slack-when-failed.outputs.slack_ts }}
      slack_url:
        description: 'URL to the Slack message'
        value: ${{ jobs.notify-slack.outputs.slack_url || jobs.notify-slack-when-failed.outputs.slack_url }}

jobs:
  build-and-test:
    runs-on: ${{ contains(matrix.platform, 'arm64') && 'ubuntu24-arm64-2-8' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - debian
          - alpine
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ (github.ref_name == 'unstable'
            || github.event_name == 'workflow_call'
            || github.event_name == 'schedule')
            && 'unstable'
            || ''
            }}
      - name: Ensure release branch
        if: inputs.release_tag != '' && inputs.run_type == 'release'
        uses: redis-developer/redis-oss-release-automation/.github/actions/ensure-release-branch@main
        with:
          release_tag: ${{ inputs.release_tag }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          release_branch: ${{ inputs.override_release_branch }}
      - uses: ./.github/actions/build-and-tag-locally
        with:
          distribution: ${{ matrix.distribution }}
          platform: ${{ matrix.platform }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          publish_image: ${{ inputs.publish_image }}
          registry_repository: ${{ format('ghcr.io/{0}', github.repository) }}
          release_tag: ${{ inputs.release_tag }}
          redisearch_version: ${{ inputs.redisearch_version }}
          redisjson_version: ${{ inputs.redisjson_version }}
          redisbloom_version: ${{ inputs.redisbloom_version }}
          redistimeseries_version: ${{ inputs.redistimeseries_version }}
          run_type: ${{ inputs.run_type }}
          modules_enabled: ${{ inputs.modules_enabled }}

  create-multi-arch-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ inputs.publish_image }}
    strategy:
      matrix:
        distribution:
          - debian
          - alpine
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          REGISTRY="${{ format('ghcr.io/{0}', github.repository) }}"

          if [[ "${{ inputs.run_type }}" == "release" ]]; then
            TAG_PREFIX="${{ inputs.release_tag }}"
          elif [[ "${{ inputs.run_type }}" == "unstable" || "${{ inputs.run_type }}" == "nightly" ]]; then
            TAG_PREFIX="unstable"
          elif [[ "${{ inputs.run_type }}" == "custom" ]]; then
            TAG_PREFIX="custom"
          else
            echo "::error::Wrong run_type value, available options are release, nightly, unstable and custom"
            exit 1
          fi

          BASE=$(printf "%s:%s-%s-%s" "$REGISTRY" "$TAG_PREFIX" "${{ github.run_id }}" "${{ matrix.distribution }}" | tr '[:upper:]' '[:lower:]')

          echo "multi_arch_tag=${BASE}" >> "$GITHUB_OUTPUT"
          echo "amd64_tag=${BASE}-amd64" >> "$GITHUB_OUTPUT"
          echo "arm64_tag=${BASE}-arm64" >> "$GITHUB_OUTPUT"

          # For releases, also produce a clean version tag without the run_id
          # e.g. ghcr.io/{repo}:8.6.0-debian — used by release_publish to apply Docker tags
          if [[ "${{ inputs.run_type }}" == "release" ]]; then
            RELEASE_TAG=$(printf "%s:%s-%s" "$REGISTRY" "$TAG_PREFIX" "${{ matrix.distribution }}" | tr '[:upper:]' '[:lower:]')
            echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ steps.tags.outputs.multi_arch_tag }} \
            ${{ steps.tags.outputs.amd64_tag }} \
            ${{ steps.tags.outputs.arm64_tag }}

      - name: Tag multi-arch image with clean version tag
        if: inputs.run_type == 'release'
        run: |
          docker buildx imagetools create \
            -t ${{ steps.tags.outputs.release_tag }} \
            ${{ steps.tags.outputs.multi_arch_tag }}

      - name: Inspect multi-arch manifest
        run: |
          docker buildx imagetools inspect ${{ steps.tags.outputs.multi_arch_tag }}

      - name: Save image metadata
        run: |
          mkdir -p /tmp/image-metadata
          cat > "/tmp/image-metadata/${{ matrix.distribution }}-multi-arch.json" << 'EOF'
          {
            "version": "${{ inputs.release_tag }}",
            "arch": "multi-arch",
            "distro": "${{ matrix.distribution }}",
            "commit": "${{ github.sha }}",
            "url": "${{ steps.tags.outputs.multi_arch_tag }}"
          }
          EOF

      - name: Upload image metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-metadata-${{ matrix.distribution }}-multi-arch
          path: /tmp/image-metadata/${{ matrix.distribution }}-multi-arch.json
          retention-days: 1

  collect-images-metadata:
    runs-on: ubuntu-latest
    needs: [build-and-test, create-multi-arch-image]
    if: ${{ always() && needs.build-and-test.result == 'success' }}
    outputs:
      docker_images_metadata: ${{ steps.collect-metadata.outputs.metadata }}
    steps:
      - name: Download all images metadata artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: image-metadata-*
          path: ./images-metadata
          merge-multiple: true

      - name: Collect images metadata from artifacts
        id: collect-metadata
        run: |
          if [ -d "./images-metadata" ] && [ "$(ls -A ./images-metadata 2>/dev/null)" ]; then
            echo "Found images metadata files:"
            # Collect all JSON files and merge them into a single array
            metadata=$(find ./images-metadata -name "*.json" -exec cat {} \; | jq -s -c '.')
            echo "Collected images metadata: $metadata"
          else
            echo "No images metadata artifacts found"
            metadata="[]"
          fi

          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"

  notify-slack:
    runs-on: ubuntu-latest
    needs: collect-images-metadata
    if: github.event.inputs.slack_channel_id != ''
    outputs:
      slack_ts: ${{ steps.slack-success.outputs.slack_ts }}
      slack_url: ${{ steps.slack-success.outputs.slack_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send Slack notification
        id: slack-success
        continue-on-error: true
        uses: ./.github/actions/slack-notification
        with:
          slack_func: slack_format_docker_images_metadata_message
          slack_channel_id: ${{ inputs.slack_channel_id }}
          release_tag: ${{ inputs.release_tag }}
          images_metadata: ${{ needs.collect-images-metadata.outputs.docker_images_metadata }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_thread_ts: ${{ inputs.slack_thread_ts }}

  notify-slack-when-failed:
    runs-on: ubuntu-latest
    needs: collect-images-metadata
    if: failure() && github.event.inputs.slack_channel_id != ''
    outputs:
      slack_ts: ${{ steps.slack-failure.outputs.slack_ts }}
      slack_url: ${{ steps.slack-failure.outputs.slack_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send Failure Slack notification
        id: slack-failure
        continue-on-error: true
        uses: ./.github/actions/slack-notification
        with:
          slack_func: slack_format_failure_message
          slack_channel_id: ${{ inputs.slack_channel_id || vars.SLACK_CHANNEL_ID }}
          release_tag: ${{ inputs.release_tag }}
          message: "Docker Build failed"
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_thread_ts: ${{ inputs.slack_thread_ts }}
